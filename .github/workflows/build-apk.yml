name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать GitHub Release с готовым APK'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Тег релиза (если запуск вручную)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & UI Tests
        run: gradle testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: gradle assembleDebug --console=plain

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk ChessLAN-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessLAN-debug-apk
          path: ChessLAN-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: ChessLAN ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            ChessLAN-debug.apk
